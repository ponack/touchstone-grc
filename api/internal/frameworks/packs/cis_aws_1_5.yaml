code: cis_aws_1_5
name: CIS AWS Foundations Benchmark v1.5.0
version: "1.5.0"
description: |
  CIS Amazon Web Services Foundations Benchmark v1.5.0 — a community-
  driven baseline for AWS account hardening. Touchstone ships rules
  in batches as the underlying AWS scanner data becomes available:
  this first batch covers Section 1 (IAM) account-level checks
  backed by GetAccountSummary and GetAccountPasswordPolicy.
  Subsequent batches will cover user-level IAM, then Section 2
  (Storage), 3 (Logging), 4 (Monitoring), 5 (Networking).

controls:
  - code: "1.4"
    title: Ensure no 'root' user account access key exists
    description: |
      The root user is the most privileged identity in an AWS account.
      Access keys give programmatic access at that privilege level —
      catastrophic if leaked. CIS 1.4 fails when the root account has
      any access key configured (active or inactive).
    severity: critical
    policy_path: cis_aws_1_5/cis_1_4.rego

  - code: "1.5"
    title: Ensure MFA is enabled for the 'root' user account
    description: |
      The root user must require multi-factor authentication. Virtual
      MFA satisfies CIS 1.5; CIS 1.6 tightens the requirement to
      hardware MFA only.
    severity: critical
    policy_path: cis_aws_1_5/cis_1_5.rego

  - code: "1.6"
    title: Ensure hardware MFA is enabled for the 'root' user account
    description: |
      Stricter sibling of CIS 1.5. The root user's MFA must be a
      hardware device — virtual MFA does not satisfy this rule.
      Touchstone reads ListVirtualMFADevices and flags the account
      when the root user is bound to a virtual device or has no MFA
      at all.
    severity: critical
    policy_path: cis_aws_1_5/cis_1_6.rego

  - code: "1.8"
    title: Ensure IAM password policy requires minimum length of 14 or greater
    description: |
      The account password policy must require at least 14 characters
      for IAM user passwords. Long passwords resist brute-force and
      credential-stuffing attacks more effectively than complexity
      rules alone. CIS 1.8 fails when no policy is configured or when
      minimum_password_length is below 14.
    severity: high
    policy_path: cis_aws_1_5/cis_1_8.rego

  - code: "1.9"
    title: Ensure IAM password policy prevents password reuse
    description: |
      The account password policy must remember at least the last 24
      passwords and prevent their reuse. CIS 1.9 fails when no policy
      is configured or when password_reuse_prevention is below 24.
    severity: high
    policy_path: cis_aws_1_5/cis_1_9.rego

  - code: "1.10"
    title: Ensure MFA is enabled for all IAM users that have a console password
    description: |
      Every IAM user with a console login profile must carry at least
      one MFA device. CIS 1.10 evaluates the same evidence as SOC 2
      CC6.1's AWS surface, framed per-user instead of as a single
      account-wide outcome.
    severity: critical
    policy_path: cis_aws_1_5/cis_1_10.rego

  - code: "1.12"
    title: Ensure credentials unused for 45 days or greater are disabled
    description: |
      Console passwords and Active access keys that have been
      unused for more than 45 days (or never used after a 45-day
      grace window since creation) must be disabled. CIS 1.12 covers
      both credential types in one rule.
    severity: high
    policy_path: cis_aws_1_5/cis_1_12.rego

  - code: "1.13"
    title: Ensure there is only one active access key per IAM user
    description: |
      Each IAM user must have at most one currently-Active access key.
      Two active keys indicate that rotation became "create a second
      key" rather than "rotate the existing one", leaving the
      superseded credential in circulation.
    severity: medium
    policy_path: cis_aws_1_5/cis_1_13.rego

  - code: "1.14"
    title: Ensure access keys are rotated every 90 days or less
    description: |
      Every Active IAM access key must have been created within the
      last 90 days. Inactive keys are out of scope — they are not in
      circulation. Same evidence as SOC 2 CC6.3 but a stricter
      90-day threshold instead of 365.
    severity: high
    policy_path: cis_aws_1_5/cis_1_14.rego

  - code: "1.15"
    title: Ensure IAM Users Receive Permissions Only Through Groups
    description: |
      Permissions should flow to IAM users through group membership,
      not via policies attached or inlined directly on the user. CIS
      1.15 fails when any user carries a non-zero count of
      attached_policies or inline_policies — even if the effective
      access happens to be safe, the administrative pattern is what
      the rule guards.
    severity: medium
    policy_path: cis_aws_1_5/cis_1_15.rego

  - code: "1.16"
    title: Ensure IAM policies that allow full "*:*" administrative privileges are not attached
    description: |
      Customer-managed policies that grant Action="*" + Resource="*"
      and that are currently attached to any principal are CIS 1.16
      findings. AWS-managed policies (AdministratorAccess and
      friends) are intentionally out of scope per CIS — the rule
      targets customer-defined admin policies that should be
      retired.
    severity: high
    policy_path: cis_aws_1_5/cis_1_16.rego

  - code: "1.17"
    title: Ensure a support role has been created to manage incidents with AWS Support
    description: |
      At least one IAM principal (user, group, or role) must hold the
      AWS managed AWSSupportAccess policy so support tickets can be
      opened without escalating to root. CIS 1.17 fails when no
      principal carries the policy.
    severity: medium
    policy_path: cis_aws_1_5/cis_1_17.rego

  - code: "1.19"
    title: Ensure that all the expired SSL/TLS certificates stored in AWS IAM are removed
    description: |
      Any IAM-uploaded server certificate whose expiration has
      already passed is a CIS 1.19 finding. Certs with no expiration
      field (legacy uploads) pass; ACM-managed certs are tracked
      separately.
    severity: medium
    policy_path: cis_aws_1_5/cis_1_19.rego

  - code: "1.21"
    title: Ensure IAM Access Analyzer is enabled for all regions
    description: |
      Every region in the operator's scope must carry at least one
      active IAM Access Analyzer. The analyzer surfaces unintended
      external sharing of IAM-managed resources (S3 buckets, KMS
      keys, IAM roles, …). CIS 1.21 fails when any configured
      region lacks an active analyzer.
    severity: high
    policy_path: cis_aws_1_5/cis_1_21.rego

  - code: "2.1.1"
    title: Ensure all S3 buckets employ encryption-at-rest
    description: |
      Every S3 bucket must have default encryption enabled (SSE-S3,
      SSE-KMS, or DSSE-KMS). Same evidence as SOC 2 CC6.7's S3
      surface, framed per-bucket as CIS expects.
    severity: high
    policy_path: cis_aws_1_5/cis_2_1_1.rego

  - code: "2.1.2"
    title: Ensure S3 Bucket Policy is set to deny HTTP requests
    description: |
      Every bucket policy must carry a Deny statement that fires on
      aws:SecureTransport=false. The scanner pre-computes the
      boolean enforces_https_only by parsing the bucket policy
      document.
    severity: high
    policy_path: cis_aws_1_5/cis_2_1_2.rego

  - code: "2.1.3"
    title: Ensure MFA Delete is enabled on S3 buckets
    description: |
      MFA Delete must be enabled on every bucket so deleting versioned
      objects requires a one-time MFA token. Versioning is the hard
      prerequisite — MFA Delete cannot be enabled without it.
    severity: high
    policy_path: cis_aws_1_5/cis_2_1_3.rego

  - code: "2.1.5"
    title: Ensure that S3 Buckets are configured with 'Block public access (bucket settings)'
    description: |
      All four Public Access Block flags must be enabled per bucket:
      block_public_acls, ignore_public_acls, block_public_policy,
      restrict_public_buckets. CIS treats the configuration as
      binary — any flag off is a finding even when no actual public
      access exists today.
    severity: critical
    policy_path: cis_aws_1_5/cis_2_1_5.rego

  - code: "2.2.1"
    title: Ensure EBS volume encryption is enabled in all regions
    description: |
      The account+region-scoped "EBS encryption by default" flag must
      be enabled in every region in scope. When on, every new EBS
      volume in that region is encrypted regardless of the creator's
      intent. Existing unencrypted volumes are not retroactively
      re-encrypted by this flag.
    severity: high
    policy_path: cis_aws_1_5/cis_2_2_1.rego

  - code: "2.3.1"
    title: Ensure that encryption-at-rest is enabled for RDS Instances
    description: |
      Every RDS instance must carry storage_encrypted=true. The flag
      is one-shot at instance creation — it cannot be enabled in
      place. Touchstone enumerates replicas and serverless DBs too;
      CIS scopes the rule to all of them.
    severity: high
    policy_path: cis_aws_1_5/cis_2_3_1.rego

  - code: "2.3.2"
    title: Ensure Auto Minor Version Upgrade feature is Enabled for RDS Instances
    description: |
      Minor versions ship security patches; auto-upgrade keeps
      instances on a supported, patched baseline without scheduled
      maintenance windows being missed.
    severity: medium
    policy_path: cis_aws_1_5/cis_2_3_2.rego

  - code: "2.3.3"
    title: Ensure that public access is not given to RDS Instance
    description: |
      publicly_accessible=true assigns a public IP to the instance.
      RDS databases should never be directly internet-facing — front
      them with a bastion / VPN / application tier instead.
    severity: critical
    policy_path: cis_aws_1_5/cis_2_3_3.rego

  - code: "2.4.1"
    title: Ensure that encryption is enabled for EFS file systems
    description: |
      Every EFS file system must be created with encryption at rest.
      The flag is one-shot at FS creation — it cannot be enabled
      later, so legacy unencrypted file systems must be migrated.
    severity: high
    policy_path: cis_aws_1_5/cis_2_4_1.rego

  - code: "3.1"
    title: Ensure CloudTrail is enabled in all regions
    description: |
      At least one CloudTrail trail must be multi-region AND
      actively logging AND include global service events. Single-
      region trails leave auditable gaps; "enabled but not logging"
      trails accumulate config without capturing events.
    severity: critical
    policy_path: cis_aws_1_5/cis_3_1.rego

  - code: "3.2"
    title: Ensure CloudTrail log file validation is enabled
    description: |
      Log file validation generates per-hour digests CloudTrail
      signs, making tampering with the underlying log objects
      detectable. Every trail must have validation enabled.
    severity: high
    policy_path: cis_aws_1_5/cis_3_2.rego

  - code: "3.3"
    title: Ensure the S3 bucket used to store CloudTrail logs is not publicly accessible
    description: |
      Cross-reference every CloudTrail trail with its S3 bucket;
      bucket must not be marked public by its policy AND must have
      all four Public Access Block flags enabled. Trails whose
      buckets aren't enumerated (cross-account log centralisation,
      for example) don't surface as findings — Touchstone only
      evaluates buckets it can observe.
    severity: high
    policy_path: cis_aws_1_5/cis_3_3.rego

  - code: "3.5"
    title: Ensure AWS Config is enabled in all regions
    description: |
      Every region in scope must carry at least one AWS Config
      recorder configured for all supported resources AND currently
      in the Recording state. Without it, configuration drift goes
      untracked.
    severity: high
    policy_path: cis_aws_1_5/cis_3_5.rego

  - code: "3.4"
    title: Ensure CloudTrail trails are integrated with CloudWatch Logs
    description: |
      Integrating with CloudWatch Logs enables real-time alerting on
      CloudTrail events. Every trail must have a CloudWatch Logs log
      group configured.
    severity: medium
    policy_path: cis_aws_1_5/cis_3_4.rego

  - code: "3.6"
    title: Ensure S3 bucket access logging is enabled on the CloudTrail S3 bucket
    description: |
      Server access logging on the trail's bucket gives a second
      evidence stream — operators can spot tampering, accidental
      deletions, or unauthorised reads of the audit logs themselves.
    severity: medium
    policy_path: cis_aws_1_5/cis_3_6.rego

  - code: "3.7"
    title: Ensure CloudTrail logs are encrypted at rest using KMS CMKs
    description: |
      Default S3 encryption (SSE-S3) is not enough for CIS — the
      trail itself must reference a KMS Customer Master Key so log
      objects encrypt with a key the operator controls.
    severity: high
    policy_path: cis_aws_1_5/cis_3_7.rego

  - code: "3.8"
    title: Ensure rotation for customer created CMKs is enabled
    description: |
      Customer-managed symmetric KMS keys must have automatic
      rotation enabled. AWS-managed keys auto-rotate annually and
      are out of scope. Asymmetric / HMAC CMKs do not support
      rotation and pass quietly.
    severity: high
    policy_path: cis_aws_1_5/cis_3_8.rego

  - code: "3.9"
    title: Ensure VPC flow logging is enabled in all VPCs
    description: |
      Every VPC must have at least one ACTIVE VPC-scoped flow log
      capturing traffic to S3, CloudWatch Logs, or Kinesis.
      Subnet- or ENI-scoped flow logs don't satisfy the rule.
    severity: medium
    policy_path: cis_aws_1_5/cis_3_9.rego

  - code: "3.10"
    title: Ensure that Object-level logging for write events is enabled for S3 bucket
    description: |
      At least one CloudTrail trail must capture S3 object-level
      WRITE events account-wide via data-event selectors.
      AdvancedEventSelectors (the newer API form) is not yet
      evaluated — tracked as a follow-up.
    severity: high
    policy_path: cis_aws_1_5/cis_3_10.rego

  - code: "3.11"
    title: Ensure that Object-level logging for read events is enabled for S3 bucket
    description: |
      Mirror of 3.10 for READ events. At least one trail must capture
      S3 object-level reads account-wide.
    severity: medium
    policy_path: cis_aws_1_5/cis_3_11.rego

  - code: "4.1"
    title: Ensure a log metric filter and alarm exist for unauthorized API calls
    description: |
      At least one CloudWatch metric filter must capture
      UnauthorizedOperation / AccessDenied events from CloudTrail
      logs, feed an alarm, and route the alarm to an SNS topic with
      at least one active subscription.
    severity: medium
    policy_path: cis_aws_1_5/cis_4_1.rego

  - code: "4.2"
    title: Ensure a log metric filter and alarm exist for Management Console sign-in without MFA
    description: |
      A CloudWatch alarm must fire when a user signs in to the
      Management Console without MFA. Filter pattern token-matched
      against ConsoleLogin + MFAUsed; the alarm must route to an SNS
      topic with an active subscription.
    severity: medium
    policy_path: cis_aws_1_5/cis_4_2.rego

  - code: "4.3"
    title: Ensure a log metric filter and alarm exist for usage of the 'root' account
    description: |
      Root account activity should be exceptional. A CloudWatch
      alarm must fire when CloudTrail records userIdentity.type=Root
      events.
    severity: high
    policy_path: cis_aws_1_5/cis_4_3.rego

  - code: "4.4"
    title: Ensure a log metric filter and alarm exist for IAM policy changes
    description: |
      A CloudWatch alarm must fire on IAM policy mutations. CIS
      lists 16 candidate event names; Touchstone token-matches
      PutRolePolicy + DeleteRolePolicy as the practical signal that
      the filter targets the IAM-policy domain.
    severity: medium
    policy_path: cis_aws_1_5/cis_4_4.rego

  - code: "4.5"
    title: Ensure a log metric filter and alarm exist for CloudTrail configuration changes
    description: |
      Operators tampering with CloudTrail must trip an alarm.
      Filter must reference CreateTrail + DeleteTrail (plus the
      usual UpdateTrail / StartLogging / StopLogging family).
    severity: high
    policy_path: cis_aws_1_5/cis_4_5.rego

  - code: "4.6"
    title: Ensure a log metric filter and alarm exist for AWS Management Console authentication failures
    description: |
      Brute-force attempts against the Console show up as
      ConsoleLogin events with errorMessage "Failed authentication".
      An alarm must fire on those.
    severity: medium
    policy_path: cis_aws_1_5/cis_4_6.rego

  - code: "4.7"
    title: Ensure a log metric filter and alarm exist for disabling or scheduled deletion of customer-managed CMKs
    description: |
      CMK tampering (DisableKey, ScheduleKeyDeletion) precedes
      data-destruction attacks. The alarm gives operators a window
      to intervene during the 7-30 day deletion grace.
    severity: high
    policy_path: cis_aws_1_5/cis_4_7.rego

  - code: "4.8"
    title: Ensure a log metric filter and alarm exist for S3 bucket policy changes
    description: |
      An alarm must fire on PutBucketPolicy / DeleteBucketPolicy.
      Operators changing bucket policies might be exfiltrating data
      or weakening access controls.
    severity: medium
    policy_path: cis_aws_1_5/cis_4_8.rego

  - code: "4.9"
    title: Ensure a log metric filter and alarm exist for AWS Config configuration changes
    description: |
      Recorder tampering (StopConfigurationRecorder,
      DeleteDeliveryChannel) leaves the account un-monitored. An
      alarm must fire on those events.
    severity: high
    policy_path: cis_aws_1_5/cis_4_9.rego

  - code: "4.10"
    title: Ensure a log metric filter and alarm exist for security group changes
    description: |
      Ingress / egress mutations on security groups must trip an
      alarm. Touchstone token-matches AuthorizeSecurityGroupIngress
      + RevokeSecurityGroupIngress as the practical signal that the
      filter targets the perimeter.
    severity: medium
    policy_path: cis_aws_1_5/cis_4_10.rego

  - code: "4.11"
    title: Ensure a log metric filter and alarm exist for changes to Network Access Control Lists
    description: |
      NACL changes alter the second layer of subnet-level network
      controls. An alarm must fire on CreateNetworkAcl /
      DeleteNetworkAcl (and the entry/replace family).
    severity: medium
    policy_path: cis_aws_1_5/cis_4_11.rego

  - code: "4.12"
    title: Ensure a log metric filter and alarm exist for changes to network gateways
    description: |
      Internet, customer, and VPN gateway mutations change the
      account's egress / ingress topology. CreateInternetGateway +
      DeleteInternetGateway must trip an alarm.
    severity: medium
    policy_path: cis_aws_1_5/cis_4_12.rego

  - code: "4.13"
    title: Ensure a log metric filter and alarm exist for route table changes
    description: |
      Route table mutations redirect traffic. Touchstone token-
      matches CreateRoute + DeleteRoute as the practical signal that
      the filter targets the routing layer.
    severity: medium
    policy_path: cis_aws_1_5/cis_4_13.rego

  - code: "4.14"
    title: Ensure a log metric filter and alarm exist for VPC changes
    description: |
      VPC mutations change the account's network boundary. CreateVpc
      + DeleteVpc must trip an alarm.
    severity: medium
    policy_path: cis_aws_1_5/cis_4_14.rego

  - code: "4.15"
    title: Ensure a log metric filter and alarm exist for AWS Organizations changes
    description: |
      Organizations API events change cross-account policy
      boundaries. CIS-recommended pattern matches on
      $.eventSource = organizations.amazonaws.com.
    severity: high
    policy_path: cis_aws_1_5/cis_4_15.rego

  - code: "5.1"
    title: Ensure no Network ACLs allow ingress from 0.0.0.0/0 to remote server administration ports
    description: |
      CIS 5.1 / 5.2 define remote server administration ports as 22
      (SSH) and 3389 (RDP). Any NACL ingress ALLOW entry with
      cidr_block=0.0.0.0/0 (or ::/0) whose port range covers either
      port is a finding. DENY entries don't trigger.
    severity: high
    policy_path: cis_aws_1_5/cis_5_1.rego

  - code: "5.2"
    title: Ensure no security groups allow ingress from 0.0.0.0/0 to remote server administration ports
    description: |
      Same admin-port set as 5.1 — ports 22 and 3389. Same evidence
      as SOC 2 CC6.6 but CIS narrows the rule to the two admin
      ports instead of the broader sensitive-port set.
    severity: high
    policy_path: cis_aws_1_5/cis_5_2.rego

  - code: "5.3"
    title: Ensure the default security group of every VPC restricts all traffic
    description: |
      Every VPC's default security group should carry zero ingress
      AND zero egress rules. Workloads that accidentally land in
      the default SG then have no implicit traffic.
    severity: medium
    policy_path: cis_aws_1_5/cis_5_3.rego
