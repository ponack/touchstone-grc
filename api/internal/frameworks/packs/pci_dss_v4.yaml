code: pci_dss_v4
name: PCI DSS v4.0
version: "4.0"
description: |
  Payment Card Industry Data Security Standard, version 4.0
  (March 2022). PCI DSS spans 12 requirements with ~300 sub-
  controls; most are procedural (training records, runbooks,
  signed policies) that automated scanners cannot evaluate.
  Touchstone ships the subset where existing AWS / Azure / GCP
  evidence directly satisfies a PCI sub-control — the catalog
  grows as new evidence sources land.

  This initial pack focuses on the network, encryption, and
  access requirements where Touchstone already collects the
  evidence other packs (SOC 2, CIS AWS) evaluate.

controls:
  - code: "1.3.2"
    title: Restrict inbound traffic to the CDE
    description: |
      Inbound traffic from untrusted networks to the cardholder
      data environment must be restricted. PCI calls out
      remote administration ports (SSH 22, RDP 3389) explicitly
      — security groups must not permit those from 0.0.0.0/0
      (or ::/0). Same evidence as CIS AWS 5.2 but framed as a
      PCI control.
    severity: high
    policy_path: pci_dss_v4/req_1_3_2.rego

  - code: "3.5.1.2"
    title: Disk- or partition-level encryption for stored account data
    description: |
      Stored account data must be rendered unreadable through
      disk- or partition-level encryption. Touchstone evaluates
      this across S3 buckets (default encryption), EBS volumes
      (per-region encryption-by-default), RDS instances
      (storage_encrypted), and EFS file systems (encrypted).
      Any unencrypted resource in scope is a finding.
    severity: high
    policy_path: pci_dss_v4/req_3_5_1_2.rego
