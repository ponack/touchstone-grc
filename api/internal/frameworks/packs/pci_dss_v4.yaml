code: pci_dss_v4
name: PCI DSS v4.0
version: "4.0"
description: |
  Payment Card Industry Data Security Standard, version 4.0
  (March 2022). PCI DSS spans 12 requirements with ~300 sub-
  controls; most are procedural (training records, runbooks,
  signed policies) that automated scanners cannot evaluate.
  Touchstone ships the subset where existing AWS / Azure / GCP
  evidence directly satisfies a PCI sub-control — the catalog
  grows as new evidence sources land.

  This initial pack focuses on the network, encryption, and
  access requirements where Touchstone already collects the
  evidence other packs (SOC 2, CIS AWS) evaluate.

controls:
  - code: "1.3.2"
    title: Restrict inbound traffic to the CDE
    description: |
      Inbound traffic from untrusted networks to the cardholder
      data environment must be restricted. PCI calls out
      remote administration ports (SSH 22, RDP 3389) explicitly
      — security groups must not permit those from 0.0.0.0/0
      (or ::/0). Same evidence as CIS AWS 5.2 but framed as a
      PCI control.
    severity: high
    policy_path: pci_dss_v4/req_1_3_2.rego

  - code: "3.5.1.2"
    title: Disk- or partition-level encryption for stored account data
    description: |
      Stored account data must be rendered unreadable through
      disk- or partition-level encryption. Touchstone evaluates
      this across S3 buckets (default encryption), EBS volumes
      (per-region encryption-by-default), RDS instances
      (storage_encrypted), and EFS file systems (encrypted).
      Any unencrypted resource in scope is a finding.
    severity: high
    policy_path: pci_dss_v4/req_3_5_1_2.rego

  - code: "4.2.1"
    title: Strong cryptography and security protocols protect PAN during transmission
    description: |
      Account data in transit must travel over strong, modern
      crypto. Touchstone evaluates AWS S3 (bucket policy denies
      non-HTTPS) and Azure Storage (supportsHttpsTrafficOnly +
      minimum_tls_version >= TLS1_2) in parallel.
    severity: high
    policy_path: pci_dss_v4/req_4_2_1.rego

  - code: "7.2.5"
    title: Application and system accounts and the privileges assigned are managed
    description: |
      System / application identities follow least privilege.
      Touchstone evaluates AWS IAM users (no direct policy
      attachments — permissions flow through groups) and GCP
      service accounts (user-managed keys rotated within 365 days).
    severity: medium
    policy_path: pci_dss_v4/req_7_2_5.rego

  - code: "8.3.6"
    title: Minimum level of complexity for passwords
    description: |
      The AWS account password policy must enforce a minimum length
      of 12 and prevent reuse of the last 4 passwords (PCI v4.0
      baseline). Touchstone reads the same evidence CIS 1.8 / 1.9
      check.
    severity: high
    policy_path: pci_dss_v4/req_8_3_6.rego

  - code: "8.4.1"
    title: MFA implemented for all access into the CDE
    description: |
      Every administrative identity must carry a second factor.
      Touchstone evaluates AWS IAM console users (at least one MFA
      device) and Azure AD members (MFA-capable + MFA-registered).
    severity: critical
    policy_path: pci_dss_v4/req_8_4_1.rego

  - code: "10.2.1"
    title: Audit logs enabled and active for all system components
    description: |
      At least one CloudTrail trail must be multi-region AND
      actively logging AND include global service events. Same
      evidence as CIS 3.1.
    severity: critical
    policy_path: pci_dss_v4/req_10_2_1.rego

  - code: "11.3.1"
    title: Internal vulnerability scans are performed
    description: |
      AWS Security Hub must be enabled and at least one compliance
      standard subscribed (CIS / AWS Foundational / PCI-DSS / NIST
      800-53 standards each carry vulnerability checks). Same
      evidence as SOC 2 CC7.1's AWS surface.
    severity: high
    policy_path: pci_dss_v4/req_11_3_1.rego

  - code: "11.5.1"
    title: Intrusion-detection / prevention techniques are used
    description: |
      At least one ENABLED AWS GuardDuty detector must exist. Same
      evidence as SOC 2 CC6.8 / CC7.3.
    severity: high
    policy_path: pci_dss_v4/req_11_5_1.rego
